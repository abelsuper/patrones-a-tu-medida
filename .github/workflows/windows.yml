name: Compilar para Windows (MSIX)

on:
  push:
    branches: [ main ]

jobs:
  build-win:
    runs-on: windows-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install cx_Freeze
        # Si usas otras librerías, agrégalas aquí

    - name: Generar paquete MSIX
      run: |
        python setup.py bdist_msix

    - name: Subir instalador
      uses: actions/upload-artifact@v4
      with:
        name: windows-msix
        path: ./**/*.msix
